<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Andrey Borodin. PostgreSQL developer.">
  <title>Andrey Borodin</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #faf9f6;
      color: #252d33;
      font: 18px/1.6 system-ui, sans-serif;
    }
    main { width: min(100%, 520px); }
    h1 { margin: 0 0 20px; font-size: clamp(40px, 9vw, 64px); line-height: 1.1; letter-spacing: -2px; }
    p { margin: 8px 0; }
    a { color: #28647c; text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    nav { margin-top: 32px; }
    @media (prefers-color-scheme: dark) {
      body { background: #172127; color: #edf1f2; }
      a { color: #8fc5d5; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world.</h1>
    <p>I'm Andrey Borodin.</p>
    <p>I work on PostgreSQL.</p>
    <nav aria-label="Links"><a href="https://github.com/x4m">GitHub</a></nav>
  </main>
</body>
</html>
